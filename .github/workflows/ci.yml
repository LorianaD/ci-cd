name: TaskFlow CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

  pull_request:
    branches:
      - main

jobs:
  backend-tests:
    uses: ./.github/workflows/backend-tests.yml

  docker-build:
    needs: backend-tests
    uses: ./.github/workflows/docker-build.yml

  docker-publish:
    needs: docker-build
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/tags/v'))

    uses: ./.github/workflows/docker-publish.yml
    permissions:
      contents: read
      packages: write
  google-chat-notify:
    needs:
      - backend-tests
      - docker-build
      - docker-publish
    if: always()

    uses: ./.github/workflows/google-chat-notify.yml

    with:
      tests_result: ${{ needs.backend-tests.result }}
      build_result: ${{ needs.docker-build.result }}
      publish_result: ${{ needs.docker-publish.result }}
    secrets:
      GOOGLE_CHAT_WEBHOOK_URL: ${{ secrets.GOOGLE_CHAT_WEBHOOK_URL }}