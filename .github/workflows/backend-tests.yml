# Reusable workflow: installs backend dependencies and runs the unit tests.
# Called by ci.yml; it is the first gate of the pipeline.

name: Backend tests

on:
  workflow_call:

jobs:
  test:
    # Pinned runner version for reproducible builds (instead of ubuntu-latest).
    runs-on: ubuntu-24.04

    # NODE_ENV comes from a repository variable (Settings > Variables),
    # so the test environment can be changed without editing the workflow.
    env:
      NODE_ENV: ${{ vars.NODE_ENV }}

    # All "run" steps execute inside the backend folder of the monorepo.
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The npm cache is keyed on the backend lockfile (not at the repo root),
      # so it is invalidated only when backend dependencies change.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # npm ci installs the exact versions from package-lock.json
      # and fails if the lockfile is out of sync with package.json.
      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test