name: Docker publish

on:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      IMAGE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend image
        run: docker build -t ghcr.io/lorianad/taskflow-backend:${{ env.IMAGE_TAG }} ./backend
      - name: Push backend image
        run: docker push ghcr.io/lorianad/taskflow-backend:${{ env.IMAGE_TAG }}